name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'hiroloop0000/gyouselshoshi'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped until repository secrets are configured."
          fi
      - uses: actions/checkout@v4
        if: steps.cloudflare.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.cloudflare.outputs.enabled == 'true'
      - run: npm run cf:types
        if: steps.cloudflare.outputs.enabled == 'true'
      - run: npm run typecheck
        if: steps.cloudflare.outputs.enabled == 'true'
      - run: npm test
        if: steps.cloudflare.outputs.enabled == 'true'
      - run: npm run build
        if: steps.cloudflare.outputs.enabled == 'true'
      - run: npx wrangler d1 migrations apply gyosei-pass-db --remote
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
